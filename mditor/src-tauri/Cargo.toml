[package]
name = "mditor"
version = "5.3.4"
description = "A local-first Markdown editor inspired by Typora"
authors = ["Mditor"]
edition = "2021"
rust-version = "1.77"

# The library name is used by Tauri's `lib` config in tauri.conf.json.
[lib]
name = "mditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# S4：devtools feature 已移除——tauri 在 debug 构建（debug_assertions）下
# 自动启用 devtools，release 构建不再携带检查器后门。
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
# Used to exit the app from the frontend menu (app_exit) and — should the
# updater ever return — relaunch after an update.
tauri-plugin-process = "2"
# Desktop-only: intercepts a second launch (e.g. double-clicking a .md while
# the app is already running) so the file path is forwarded to the live process
# instead of spawning another instance.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# AI chat: OpenAI-compatible HTTP client. rustls-tls avoids a native OpenSSL
# dependency on Windows (the bundled reqwest uses native-tls by default).
# `stream` enables resp.bytes_stream() for SSE streaming in ai_chat_stream.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# S3：SSRF 校验解析端点 host（tauri 传递依赖已有，提为直接使用）。
url = "2"
# StreamExt::next over the reqwest byte stream while parsing SSE chunks.
futures-util = "0.3"
# 云同步文件通道（v4.12.4）：s3_upload_file / s3_download_file 的异步文件
# 读写。tokio 已在依赖树内（tauri runtime），这里只是显式声明 fs 能力。
tokio = { version = "1", default-features = false, features = ["fs", "time"] }
# 云同步（v4.12）：S3 协议兼容对象存储客户端。default-features=false 只带
# aws（SigV4 签名/ListObjectsV2 分页等久经考验的实现交给它），不拉 azure/gcp。
# 刻意停在 0.13 而非 0.14：0.14 的 aws feature 硬依赖 aws-lc-rs（Windows 构
# 建 NASM/CMake），0.13 用 ring 即可无额外构建工具链编译。
# object_store 自带 HTTP 客户端（reqwest+rustls），刻意不与 crate::ai::http()
# 共享——AI 代理客户端无全局超时语义，同步客户端需要独立连接池与超时。
object_store = { version = "0.13", default-features = false, features = ["aws"] }

# S2：密钥系统凭据存储（Windows Credential Manager / DPAPI）。版本对齐依赖树
# 中已有的 0.61.2（mio/notify/muda 等在用），不引入新的版本碎片。
# PI2（应用内打印）：Gdi/Printing 两个 feature 供 printing.rs 的 GDI 直打
# 引擎使用（EnumPrinters/DocumentProperties/CreateDC/StretchDIBits 全家）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Security_Credentials",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Storage_Xps",
] }
# PI2（应用内打印）：打印页 PNG 解码（纯 Rust，零外部程序）。前端 pdf.js
# 光栅化的页图经临时文件传入，本侧解码为 BGRA 后 StretchDIBits 送打印机。
png = "0.17"

[features]
# This feature is used for production builds or when a dev server is not
# specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# 安全锚点测试（shell_open_scope_tests）用：插件运行时才编译 tauri.conf.json
# 的 shell.open 正则（写错 = 启动 panic），dev 侧提前用同一 regex crate 校验
# 语法并钉住放行/拒绝语义。版本对齐依赖树已有版本，无新增碎片。
[dev-dependencies]
regex = "1"

# Release profile — agressively optimize the final binary.
#   lto=true         : cross-crate link-time optimization (inlines across crates)
#   codegen-units=1  : whole-program optimization at the cost of compile time
#   strip=true       : discard debug symbols (much smaller .exe)
#   panic="abort"    : no unwind tables (smaller binary, slight startup win)
# Trade-off: the FIRST release build is slower, but the resulting app is
# markedly smaller and faster. Only paid once per clean build.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
