<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP is enforced at the Tauri layer (tauri.conf.json app.security.csp).
         This meta is a fallback for `vite dev` in a plain browser. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' asset: http://asset.localhost data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ipc: http://ipc.localhost; font-src 'self' data:"
    />
    <title>Mditor</title>
    <!-- 开屏动画：纯静态 HTML/CSS，在 JS bundle 加载/执行期间即已绘制，
         只覆盖原本的白屏时间；React 就绪后由 src/lib/splash.ts 淡出移除。
         背景色按主题硬编码（styles/themes/*.css 的 --bg）——主题 CSS 是
         JS 异步应用的，这里用不了 var(--bg)，否则深色用户会先看到一帧白闪。 -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #ffffff; /* light（默认） */
        color: #4f46e5; /* --accent, indigo-600 */
        transition: opacity 0.24s ease;
      }
      #splash .splash-logo {
        width: 56px;
        height: 56px;
        animation: splash-zoom 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #splash .splash-name {
        font: 700 15px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.02em;
        color: #1f2328; /* 浅色主题 --fg */
        animation: splash-rise 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both;
      }
      #splash.is-done {
        opacity: 0;
        /* 淡出期间不拦截交互——应用已在下方就绪 */
        pointer-events: none;
      }
      html[data-theme="dark"] #splash {
        background: #1e1e1e;
        color: #818cf8; /* --accent, indigo-400 */
      }
      html[data-theme="dark"] #splash .splash-name {
        color: #e5e7eb;
      }
      html[data-theme="sepia"] #splash {
        background: #f5ecd9;
      }
      html[data-theme="claude"] #splash {
        background: #faf9f5;
      }
      html[data-theme="claude-dark"] #splash {
        background: #1f1e1d;
        color: #818cf8;
      }
      html[data-theme="claude-dark"] #splash .splash-name {
        color: #e5e7eb;
      }
      @keyframes splash-zoom {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
      }
      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-logo,
        #splash .splash-name {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <!-- 与 src/components/icons.tsx 的 LogoIcon 同几何：圆角方框 + M 字形 -->
      <svg
        class="splash-logo"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="5" width="18" height="14" rx="3.5" />
        <path d="M7.5 15.5v-6.5l4.5 4 4.5-4v6.5" />
      </svg>
      <span class="splash-name">Mditor</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
