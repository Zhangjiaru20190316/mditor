# Build + publish a release.
#
# Trigger: push a tag like `v3.5.0`. The workflow then:
#   1. Builds the Tauri bundle (NSIS installer) on Windows.
#   2. Creates a GitHub Release and uploads the installer as an asset.
#   3. Builds an unsigned HarmonyOS HAP and attaches it to the same Release
#      (sign it locally with scripts/sign-and-install.mjs materials — certs
#      never enter CI). Set the repo variable HARMONY_CLT_URL to a zip of the
#      HarmonyOS Command-Line Tools to enable; unset = job skips gracefully.
#
# `workflow_dispatch` runs only the harmony build (artifact, no release
# upload) to validate the toolchain before cutting a tag.
#
# Note: the auto-update plugin was removed in v3.5.0 (its endpoint was a
# placeholder that could never succeed); releases are plain downloads. See
# README.md ("自动更新的移除") for how to reintroduce it with real endpoints.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # Add macOS by uncommenting:
          # - platform: macos-latest
          #   args: "--target aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # npm 11 (Node 24) — npm 10 mis-handles the lockfile's cross-platform
          # esbuild optional deps (vitest 4 needs esbuild 0.28), failing `npm ci`.
          node-version: 24
          cache: npm
          cache-dependency-path: mditor/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache cargo registry + target dir — the release profile (lto=true,
      # codegen-units=1) makes cold builds take 10-20 min; this keeps tags
      # after the first one fast.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mditor/src-tauri

      - name: Install frontend deps
        run: npm ci
        working-directory: mditor

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: mditor
          # Derive the version + release name from the pushed tag (e.g. v3.5.0).
          tagName: ${{ github.ref_name }}
          releaseName: "Mditor ${{ github.ref_name }}"
          releaseBody: "See the assets below to download the NSIS installer (Mditor_x64-setup.exe)."
          releaseDraft: false
          prerelease: false

  harmony:
    # Unsigned HAP for the Release (sign locally, see mditor/docs/harmony-release.md).
    # Skips with a warning when the HARMONY_CLT_URL repo variable is not set —
    # the CLT zip sits behind a login wall, so it is self-hosted.
    # always()+skipped: on workflow_dispatch `publish` is skipped and must not
    # drag this job along with it.
    name: HarmonyOS HAP
    runs-on: ubuntu-latest
    needs: publish
    if: always() && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Check CLT configured
        run: |
          if [ -z "${{ vars.HARMONY_CLT_URL }}" ]; then
            echo "::warning::Repo variable HARMONY_CLT_URL is not set (HarmonyOS Command-Line Tools zip URL) — skipping the Harmony build."
            echo "CLT_SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        if: env.CLT_SKIP != '1'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mditor/package-lock.json

      - name: Setup JDK 17
        if: env.CLT_SKIP != '1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download HarmonyOS Command-Line Tools
        if: env.CLT_SKIP != '1'
        run: |
          curl -L --fail --retry 3 -o /tmp/clt.zip "${{ vars.HARMONY_CLT_URL }}"
          mkdir -p "$HOME/harmony-clt"
          unzip -q /tmp/clt.zip -d "$HOME/harmony-clt"
          # The zip ships a command-line-tools/ top folder; fall back to the
          # extract root if a future build flattens it.
          if [ -x "$HOME/harmony-clt/command-line-tools/bin/hvigorw" ]; then
            echo "HARMONY_CLT_HOME=$HOME/harmony-clt/command-line-tools" >> "$GITHUB_ENV"
          else
            echo "HARMONY_CLT_HOME=$HOME/harmony-clt" >> "$GITHUB_ENV"
          fi
          # Zips lose the exec bit hvigorw/ohpm need.
          chmod +x "$HOME"/harmony-clt/command-line-tools/bin/* \
                   "$HOME"/harmony-clt/command-line-tools/ohpm/bin/* 2>/dev/null || true

      - name: Install frontend deps
        if: env.CLT_SKIP != '1'
        run: npm ci
        working-directory: mditor

      - name: Build unsigned HAP
        if: env.CLT_SKIP != '1'
        working-directory: mditor
        run: node scripts/build-harmony.mjs

      - name: Upload to release (tag) / artifact (dispatch)
        if: env.CLT_SKIP != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./mditor/package.json').version")"
          HAP="mditor/harmony/entry/build/default/outputs/default/entry-default-unsigned.hap"
          ASSET="Mditor_${VERSION}_harmony-unsigned.hap"
          cp "$HAP" "/tmp/$ASSET"
          # On tag pushes attach to the Release tauri-action just created;
          # workflow_dispatch runs only produce the artifact below.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release upload "${GITHUB_REF#refs/tags/}" "/tmp/$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            cp "/tmp/$ASSET" "$ASSET"
          fi

      - uses: actions/upload-artifact@v4
        if: env.CLT_SKIP != '1'
        with:
          name: harmony-unsigned-hap
          path: Mditor_*_harmony-unsigned.hap
          if-no-files-found: ignore
